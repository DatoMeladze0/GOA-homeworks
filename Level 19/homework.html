<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>სარეგისტრაციო გვერდი</h1>
        <label for="First name">სახელი</label><br>
        <input type="text" id="First name">
        <br><br>
        <label for="Last name">გვარი</label><br>
        <input type="text" id="Last name">
        <br><br>
        <label for="Email">მეილი</label><br>
        <input type="email" id="Email">
        <br><br>
        <label for="Password">პაროლი</label><br>
        <input type="password" id="Password">
        <br><br>
        <button>დარეგისტრირება</button>
    </form>
    <!--label გვაძლევს ტექსტურ აღწერილობას მითითებულ input თეგისთვის რაც აუმჯობესებს მომხმარებლისთვის ხელმისაწვდომობას. label რომ დავაკავშიროთ Input-თან, უნდა 
    გამოვიყებოთ for ატრიბუტი label თეგში და id ატრიბუტი input თეგში რომელთა მნიშვნელობებიც უნდა ემთხვეოდეს ერთმანეთს.-->
</body>
</html>
