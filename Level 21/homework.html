<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration</h1>
    <form>
        <!--რათა მომხმარებელმა შეძლოს ზუსტად ერთი ვარიანტის არჩევა წინასწარ განსაზღვრული, ურთიერთგამომრიცხავი ვარიანტების სიიდან-->
        <!--სერვერზე ფორმის გასაგზავნად სახელის/მნიშვნელობის წყვილების შესაქმნელად-->
        <!--placeholder ატრიბუტი იძლევა მოკლე მინიშნებას, რომელიც აღწერს შეყვანის ველის ან ტექსტური არეალის მოსალოდნელ მნიშვნელობას.-->
        <!--required არის ატრიბუტი, რომელიც გამოიყენება ფორმებში იმის მითითებისთვის, რომ ფორმის გაგზავნამდე ფორმის ველი უნდა შეივსოს ან მოინიშნოს.-->
        <!--value ატრიბუტი განსაზღვრავს ელემენტთან ასოცირებულ მნიშვნელობას.-->
        <label for="saxeli">შეიყვანეთ თქვენი სახელი:</label>
        <input type="text" id="saxeli" placeholder="თქვენი სახელი" name="saxeli" required>
        <br><br>
        <label for="gvari">შეიყვანეთ თქვენი გვარი:</label>
        <input type="text" id="gvari" placeholder="თქვენი გვარი" name="gvari">
        <br><br>
        <label for="email">შეიყვანეთ თქვენი მეილი:</label>
        <input type="email" id="email" placeholder="თქვენი მეილი" name="email" required>
        <br><br>
        <label for="paroli">შეიყვანეთ თქვენი პაროლი:</label>
        <input type="password" id="paroli" placeholder="თქვენი პაროლი" name="paroli" required>
        <br><br>
        <label>აირჩიეთ თქვენი გენდერი</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <button>Submit</button>
    </form>
</body>
</html>
