<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--block level ელემენტი ყოველთვის ახალი ხაზიდან იწყება და ბრაუზერები ავტომატურად ამატებენ გარკვეულ სივრცეს ელემენტის წინ და შემდეგ.-->
    <!--inline ელემენტი ახალ ხაზზე არ იწყება, იგი მხოლოდ იმდენ სიგანეს იკავებს, რამდენიც საჭიროა.-->
    <!--CSS აკონტროლებს ისეთ ასპექტებს, როგორიცაა ფერები, შრიფტები, განლაგება და დაშორება, რაც ეფექტურად გამოყოფს ვებსაიტის სტრუქტურას (HTML) მისი ვიზუალური დიზაინისგან.-->
    <!--inline CSS არის ვებ ელემენტებზე სტილების გამოყენების სამი მეთოდიდან ერთ-ერთი, რომელიც გამოიყენება უნიკალური სტილების ერთ HTML ელემენტზე პირდაპირ მის გახსნის ტეგში, style ატრიბუტის გამოყენებით.-->
    <!--style ატრიბუტი საშუალებას გაძლევთ გამოიყენოთ CSS პირდაპირ კონკრეტულ HTML ელემენტზე.-->
    <!--background_color არის ელემენტისთვის მყარი ფერის ფონის დაყენება. ის ვრცელდება შინაარსსა და შევსების არეებზე, მაგრამ არა კიდეზე.-->
    <!--color განსაზღვრავს ელემენტის შინაარსის, ძირითადად ტექსტის, ფერს.-->
    <!--text-align განსაზღვრავს კონტენტის ჰორიზონტალურ განლაგებას-->
    <!--width ელემენტის ჰორიზონტალურ ზომას ადგენს (სიგანეს).-->
    <!--height განსაზღვრავს ელემენტის ვერტიკალურ ზომას (სიმაღლეს).-->
</body>
</html>
