<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>
    <h1>Registration</h1>
    <form>
        <label for="saxeli">Enter your first name:</label>
        <input type="text" name="saxeli" id="saxeli" placeholder="your first name" required>
        <br><br>
        <label for="gvari">Enter your last name:</label>
        <input type="text" name="gvari" id="gvari" placeholder="your last name" required>
        <br><br>
        <label>choose your gender:</label>
        <label for="male1">Male</label>
        <input type="radio" value="male" name="gender" id="male1" required>
        <label for="female1">Female</label>
        <input type="radio" id="female1" name="gender" value="female" required>
        <br><br>
        <label for="terms">I agree with terms and conditions</label>
        <input type="checkbox" name="terms1" id="terms" required>
        <br><br>
        <select>
            <option>Georgia</option>
            <option>United States</option>
            <option>Russia</option>
            <option>Turkey</option>
            <option>Italy</option>
            <option>Japan</option>
            <option>China</option>
            <option>France</option>
            <option>Spain</option>
            <option>Germany</option>
        </select>
        <br><br>
        <button>Submit</button>
    </form>
</body>
</html>
