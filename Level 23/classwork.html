<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration</h1>
    <form>
        <label for="saxeli">Enter your name:</label>
        <input type="text" name="saxeli" id="saxeli" placeholder="your name" required>
        <br><br>
        <label for="feri">choose your favorite color:</label>
        <input type="color" name="feri" id="feri" required>
        <br><br>
        <label for="emaili">Enter your email</label>
        <input type="email" name="emaili" placeholder="your email" id="emaili" required>
        <br><br>
        <label for="paroli">Enter your password</label>
        <input type="password" name="paroli" placeholder="your password" id="paroli" required>
        <br><br>
        <label for="dabadeba">Enter your birth date:</label>
        <input type="date" name="dabadebis_tarigi" id="dabadeba" required>
        <br><br>
        <label>choose your gender:</label>
        <label for="male1">Male</label>
        <input type="radio" value="male" name="gender" id="male1" required>
        <label for="female1">Female</label>
        <input type="radio" id="female1" name="gender" value="female" required>
        <br><br>
        <label for="terms">I agree with terms and conditions</label>
        <input type="checkbox" name="terms1" id="terms" required>
        <br><br>
        <button>Submit</button>
    </form>
</body>
</html>
